spring:
  application:
    name: agenthub-backend

server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

agenthub:
  auth:
    enabled: ${AGENTHUB_AUTH_ENABLED:true}
  realtime:
    enabled: ${AGENTHUB_REALTIME_ENABLED:true}
    heartbeat-seconds: ${AGENTHUB_REALTIME_HEARTBEAT_SECONDS:25}
    event-retention-per-conversation: ${AGENTHUB_REALTIME_EVENT_RETENTION_PER_CONVERSATION:200}
    run-state-ttl-minutes: ${AGENTHUB_REALTIME_RUN_STATE_TTL_MINUTES:30}
  persistence:
    mode: ${AGENTHUB_PERSISTENCE_MODE:memory}
    jdbc:
      url: ${AGENTHUB_JDBC_URL:}
      username: ${AGENTHUB_JDBC_USERNAME:}
      password: ${AGENTHUB_JDBC_PASSWORD:}
  attachments:
    storage-dir: ${AGENTHUB_ATTACHMENTS_STORAGE_DIR:${user.home}/.agenthub/agenthub/uploads}
    max-file-size-bytes: ${AGENTHUB_ATTACHMENTS_MAX_FILE_SIZE_BYTES:5242880}
  cors:
    allowed-origins: ${AGENTHUB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://tauri.localhost,https://tauri.localhost,tauri://localhost}
  memory:
    persistence:
      enabled: ${AGENTHUB_MEMORY_PERSISTENCE_ENABLED:true}
      path: ${AGENTHUB_MEMORY_PERSISTENCE_PATH:${user.home}/.agenthub/agenthub/memories.json}
    retrieval:
      limit: ${AGENTHUB_MEMORY_RETRIEVAL_LIMIT:6}
  context:
    retrieval:
      limit: ${AGENTHUB_CONTEXT_RETRIEVAL_LIMIT:8}
    search:
      fulltext-enabled: ${AGENTHUB_CONTEXT_SEARCH_FULLTEXT_ENABLED:false}
      message-window: ${AGENTHUB_CONTEXT_SEARCH_MESSAGE_WINDOW:50}
      artifact-window: ${AGENTHUB_CONTEXT_SEARCH_ARTIFACT_WINDOW:50}
      attachment-window: ${AGENTHUB_CONTEXT_SEARCH_ATTACHMENT_WINDOW:30}
      task-run-window: ${AGENTHUB_CONTEXT_SEARCH_TASK_RUN_WINDOW:20}
      grep-limit: ${AGENTHUB_CONTEXT_SEARCH_GREP_LIMIT:20}
      read-max-chars: ${AGENTHUB_CONTEXT_SEARCH_READ_MAX_CHARS:4000}
    semantic:
      backend: ${AGENTHUB_CONTEXT_SEMANTIC_BACKEND:heuristic}
      embedding:
        provider: ${AGENTHUB_CONTEXT_EMBEDDING_PROVIDER:disabled}
  orchestrator:
    artifact-generation-mode: ${AGENTHUB_ARTIFACT_GENERATION_MODE:HYBRID_REAL}
    step-delay-millis: ${AGENTHUB_ORCHESTRATOR_STEP_DELAY_MILLIS:0}
    auto-trigger:
      enabled: ${AGENTHUB_ORCHESTRATOR_AUTO_TRIGGER_ENABLED:true}
      require-approval: ${AGENTHUB_ORCHESTRATOR_AUTO_TRIGGER_REQUIRE_APPROVAL:true}
      mode: ${AGENTHUB_ORCHESTRATOR_AUTO_TRIGGER_MODE:KEYWORD_OR_MENTION}
      keywords: ${AGENTHUB_ORCHESTRATOR_AUTO_TRIGGER_KEYWORDS:生成,创建,实现,修改,检查,review,页面,组件,workflow,工作流,协作,agent}
    planner:
      type: ${AGENTHUB_PLANNER_TYPE:RULE_BASED}
      fallback-to-rule-based: ${AGENTHUB_PLANNER_FALLBACK_TO_RULE_BASED:true}
    review:
      force-rejection-enabled: ${AGENTHUB_REVIEW_FORCE_REJECTION_ENABLED:false}
      rejection-keywords: "${AGENTHUB_REVIEW_REJECTION_KEYWORDS:REJECTION,decision: reject,reject,不通过,拒绝,blocker,阻塞}"
  adapters:
    default-type: MOCK
    stats:
      persistence:
        enabled: ${AGENTHUB_ADAPTER_STATS_PERSISTENCE_ENABLED:true}
        path: ${AGENTHUB_ADAPTER_STATS_PERSISTENCE_PATH:${user.home}/.agenthub/agenthub/adapter-route-stats.json}
    quality:
      persistence:
        enabled: ${AGENTHUB_ADAPTER_QUALITY_PERSISTENCE_ENABLED:true}
        path: ${AGENTHUB_ADAPTER_QUALITY_PERSISTENCE_PATH:${user.home}/.agenthub/agenthub/adapter-quality-metrics.json}
    openai-compatible:
      enabled: ${AGENTHUB_OPENAI_ENABLED:false}
      base-url: ${AGENTHUB_OPENAI_BASE_URL:}
      api-key: ${AGENTHUB_OPENAI_API_KEY:}
      model: ${AGENTHUB_OPENAI_MODEL:}
      timeout-seconds: 30
      streaming-enabled: ${AGENTHUB_OPENAI_STREAMING_ENABLED:false}
      json-response-format-enabled: ${AGENTHUB_OPENAI_JSON_RESPONSE_FORMAT_ENABLED:false}
      max-retries: ${AGENTHUB_OPENAI_MAX_RETRIES:1}
      retry-backoff-millis: ${AGENTHUB_OPENAI_RETRY_BACKOFF_MILLIS:500}
      fixture-enabled: ${AGENTHUB_OPENAI_FIXTURE_ENABLED:false}
      fixture-review-decision: ${AGENTHUB_OPENAI_FIXTURE_REVIEW_DECISION:APPROVE}
    codex:
      enabled: ${AGENTHUB_CODEX_ENABLED:false}
      command: ${AGENTHUB_CODEX_COMMAND:codex}
      model: ${AGENTHUB_CODEX_MODEL:}
      timeout-seconds: ${AGENTHUB_CODEX_TIMEOUT_SECONDS:120}
      streaming-enabled: ${AGENTHUB_CODEX_STREAMING_ENABLED:false}
      artifact-only: ${AGENTHUB_CODEX_ARTIFACT_ONLY:true}
      work-dir: ${AGENTHUB_CODEX_WORK_DIR:${user.home}/.agenthub/agenthub/codex-runs}
      fixture-enabled: ${AGENTHUB_CODEX_FIXTURE_ENABLED:false}
      fixture-stream-chunk-delay-millis: ${AGENTHUB_CODEX_FIXTURE_STREAM_CHUNK_DELAY_MILLIS:0}
    claude-code:
      enabled: ${AGENTHUB_CLAUDE_CODE_ENABLED:false}
      command: ${AGENTHUB_CLAUDE_CODE_COMMAND:claude}
      args-template: ${AGENTHUB_CLAUDE_CODE_ARGS_TEMPLATE:}
      model: ${AGENTHUB_CLAUDE_CODE_MODEL:sonnet}
      max-turns: ${AGENTHUB_CLAUDE_CODE_MAX_TURNS:3}
      timeout-seconds: ${AGENTHUB_CLAUDE_CODE_TIMEOUT_SECONDS:120}
      streaming-enabled: ${AGENTHUB_CLAUDE_CODE_STREAMING_ENABLED:false}
      artifact-only: ${AGENTHUB_CLAUDE_CODE_ARTIFACT_ONLY:true}
      allowed-tools: ${AGENTHUB_CLAUDE_CODE_ALLOWED_TOOLS:Read,Grep,Glob}
      disallowed-tools: ${AGENTHUB_CLAUDE_CODE_DISALLOWED_TOOLS:Edit,MultiEdit,Write,NotebookEdit,Bash}
      work-dir: ${AGENTHUB_CLAUDE_CODE_WORK_DIR:${user.home}/.agenthub/agenthub/claude-code-runs}
      fixture-enabled: ${AGENTHUB_CLAUDE_CODE_FIXTURE_ENABLED:false}
      fixture-stream-chunk-delay-millis: ${AGENTHUB_CLAUDE_CODE_FIXTURE_STREAM_CHUNK_DELAY_MILLIS:0}
    open-code:
      enabled: ${AGENTHUB_OPEN_CODE_ENABLED:false}
      command: ${AGENTHUB_OPEN_CODE_COMMAND:opencode}
      args-template: ${AGENTHUB_OPEN_CODE_ARGS_TEMPLATE:}
      timeout-seconds: 30
