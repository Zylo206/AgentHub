spring:
  application:
    name: agenthub-backend

server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

agenthub:
  persistence:
    mode: ${AGENTHUB_PERSISTENCE_MODE:memory}
    jdbc:
      url: ${AGENTHUB_JDBC_URL:}
      username: ${AGENTHUB_JDBC_USERNAME:}
      password: ${AGENTHUB_JDBC_PASSWORD:}
  attachments:
    storage-dir: ${AGENTHUB_ATTACHMENTS_STORAGE_DIR:./.agenthub/uploads}
    max-file-size-bytes: ${AGENTHUB_ATTACHMENTS_MAX_FILE_SIZE_BYTES:5242880}
  memory:
    persistence:
      enabled: ${AGENTHUB_MEMORY_PERSISTENCE_ENABLED:true}
      path: ${AGENTHUB_MEMORY_PERSISTENCE_PATH:./.agenthub/memories.json}
    retrieval:
      limit: ${AGENTHUB_MEMORY_RETRIEVAL_LIMIT:6}
  orchestrator:
    artifact-generation-mode: ${AGENTHUB_ARTIFACT_GENERATION_MODE:HYBRID_REAL}
    auto-trigger:
      enabled: ${AGENTHUB_ORCHESTRATOR_AUTO_TRIGGER_ENABLED:false}
      require-approval: ${AGENTHUB_ORCHESTRATOR_AUTO_TRIGGER_REQUIRE_APPROVAL:true}
      mode: ${AGENTHUB_ORCHESTRATOR_AUTO_TRIGGER_MODE:KEYWORD_OR_MENTION}
      keywords: ${AGENTHUB_ORCHESTRATOR_AUTO_TRIGGER_KEYWORDS:生成,创建,实现,修改,检查,review,页面,组件,workflow,工作流,协作,agent}
    planner:
      type: ${AGENTHUB_PLANNER_TYPE:RULE_BASED}
      fallback-to-rule-based: ${AGENTHUB_PLANNER_FALLBACK_TO_RULE_BASED:true}
    review:
      force-rejection-enabled: ${AGENTHUB_REVIEW_FORCE_REJECTION_ENABLED:false}
      rejection-keywords: "${AGENTHUB_REVIEW_REJECTION_KEYWORDS:REJECTION,decision: reject,reject,不通过,拒绝,blocker,阻塞}"
  adapters:
    default-type: MOCK
    stats:
      persistence:
        enabled: ${AGENTHUB_ADAPTER_STATS_PERSISTENCE_ENABLED:true}
        path: ${AGENTHUB_ADAPTER_STATS_PERSISTENCE_PATH:./.agenthub/adapter-route-stats.json}
    openai-compatible:
      enabled: ${AGENTHUB_OPENAI_ENABLED:false}
      base-url: ${AGENTHUB_OPENAI_BASE_URL:}
      api-key: ${AGENTHUB_OPENAI_API_KEY:}
      model: ${AGENTHUB_OPENAI_MODEL:}
      timeout-seconds: 30
      fixture-enabled: ${AGENTHUB_OPENAI_FIXTURE_ENABLED:false}
      fixture-review-decision: ${AGENTHUB_OPENAI_FIXTURE_REVIEW_DECISION:APPROVE}
    codex:
      enabled: ${AGENTHUB_CODEX_ENABLED:false}
      command: ${AGENTHUB_CODEX_COMMAND:codex}
      args-template: ${AGENTHUB_CODEX_ARGS_TEMPLATE:}
      timeout-seconds: 30
    claude-code:
      enabled: ${AGENTHUB_CLAUDE_CODE_ENABLED:false}
      command: ${AGENTHUB_CLAUDE_CODE_COMMAND:claude}
      args-template: ${AGENTHUB_CLAUDE_CODE_ARGS_TEMPLATE:}
      timeout-seconds: 30
    open-code:
      enabled: ${AGENTHUB_OPEN_CODE_ENABLED:false}
      command: ${AGENTHUB_OPEN_CODE_COMMAND:opencode}
      args-template: ${AGENTHUB_OPEN_CODE_ARGS_TEMPLATE:}
      timeout-seconds: 30
