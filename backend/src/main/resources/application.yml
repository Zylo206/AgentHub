spring:
  application:
    name: agenthub-backend

server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

agenthub:
  adapters:
    default-type: MOCK
    openai-compatible:
      enabled: false
      base-url: ${AGENTHUB_OPENAI_BASE_URL:}
      api-key: ${AGENTHUB_OPENAI_API_KEY:}
      model: ${AGENTHUB_OPENAI_MODEL:}
      timeout-seconds: 30
    codex:
      enabled: false
    claude-code:
      enabled: false
    open-code:
      enabled: false
