spring:
  application:
    name: agenthub-backend

server:
  port: 8080

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

agenthub:
  memory:
    persistence:
      enabled: ${AGENTHUB_MEMORY_PERSISTENCE_ENABLED:true}
      path: ${AGENTHUB_MEMORY_PERSISTENCE_PATH:./.agenthub/memories.json}
    retrieval:
      limit: ${AGENTHUB_MEMORY_RETRIEVAL_LIMIT:6}
  orchestrator:
    planner:
      type: ${AGENTHUB_PLANNER_TYPE:RULE_BASED}
      fallback-to-rule-based: ${AGENTHUB_PLANNER_FALLBACK_TO_RULE_BASED:true}
  adapters:
    default-type: MOCK
    openai-compatible:
      enabled: false
      base-url: ${AGENTHUB_OPENAI_BASE_URL:}
      api-key: ${AGENTHUB_OPENAI_API_KEY:}
      model: ${AGENTHUB_OPENAI_MODEL:}
      timeout-seconds: 30
    codex:
      enabled: ${AGENTHUB_CODEX_ENABLED:false}
      command: ${AGENTHUB_CODEX_COMMAND:codex}
      args-template: ${AGENTHUB_CODEX_ARGS_TEMPLATE:}
      timeout-seconds: 30
    claude-code:
      enabled: ${AGENTHUB_CLAUDE_CODE_ENABLED:false}
      command: ${AGENTHUB_CLAUDE_CODE_COMMAND:claude}
      args-template: ${AGENTHUB_CLAUDE_CODE_ARGS_TEMPLATE:}
      timeout-seconds: 30
    open-code:
      enabled: ${AGENTHUB_OPEN_CODE_ENABLED:false}
      command: ${AGENTHUB_OPEN_CODE_COMMAND:opencode}
      args-template: ${AGENTHUB_OPEN_CODE_ARGS_TEMPLATE:}
      timeout-seconds: 30
